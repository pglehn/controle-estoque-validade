name: Testes automatizados e cobertura

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes-postgresql:
    name: Testes com PostgreSQL e cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estoque
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estoque"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_ENGINE: postgresql
      DB_NAME: estoque
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt "coverage>=7.6,<8"
      - name: Executar testes e medir cobertura
        shell: bash
        run: |
          set -o pipefail
          python -m coverage run --source=estoque,configuracao --omit='*/tests.py,*/migrations/*' manage.py test estoque --verbosity=2 2>&1 | tee resultados-testes.log
          python -m coverage report -m --omit='*/tests.py,*/migrations/*' 2>&1 | tee cobertura.log
      - name: Publicar resumo dos resultados
        if: always()
        shell: bash
        run: |
          {
            echo '## Resultado dos testes'
            echo '```text'
            if [ -f resultados-testes.log ]; then grep -E '^Ran [0-9]+ tests|^OK$|^FAILED|^ERROR' resultados-testes.log || true; else echo 'A execução dos testes não foi iniciada.'; fi
            echo '```'
            echo '## Cobertura de código'
            echo '```text'
            if [ -f cobertura.log ]; then grep -E '^Name|^---|^TOTAL' cobertura.log || true; else echo 'O relatório de cobertura não foi gerado.'; fi
            echo '```'
            echo '### Testes registrados no log'
            echo '```text'
            if [ -f resultados-testes.log ]; then grep -E 'test_.*\.\.\. (ok|FAIL|ERROR|skipped)' resultados-testes.log || true; fi
            echo '```'
            echo 'A cobertura mede o código dos módulos estoque e configuracao; arquivos de testes e migrações foram excluídos.'
          } >> "$GITHUB_STEP_SUMMARY"
