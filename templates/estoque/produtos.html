{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <h1 class="h3 mb-0">Produtos</h1><a class="btn btn-primary" href="{% url 'estoque:novo_produto' %}">Cadastrar produto</a>
</div>
<div class="card"><div class="table-responsive"><table class="table mb-0 align-middle">
  <thead><tr><th>Produto</th><th>Unidade</th></tr></thead><tbody>
  {% for produto in produtos %}<tr><td>{{ produto.nome }}</td><td>{{ produto.get_unidade_display }}</td></tr>
  {% empty %}<tr><td colspan="2" class="text-secondary">Nenhum produto cadastrado.</td></tr>{% endfor %}
  </tbody>
</table></div></div>
{% endblock %}
